# Netlify's base directory for this site is netlify-deploy/ (this folder). The build steps
# up to the repo root because the build scripts and event renderer live there.
#
# Build: install dependencies, build the event pages + listings from the published events
# in Supabase (scripts/build-events.mjs), then bundle index/events/about
# (build_netlify_bundle.py). The CMS triggers this build through a build hook on publish.
[build]
  command = "cd .. && npm ci && node scripts/build-events.mjs && python3 build_netlify_bundle.py"
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The edge function's route (path/excludedPath) is declared via its own
# `export const config` in netlify/edge-functions/gate.ts instead of here,
# to avoid two conflicting declarations of the same route.

# The past event was renamed; keep old bookmarks and shared links working.
[[redirects]]
  from = "/events/building-the-future-outside-the-gravity-of-the-present.html"
  to = "/events/so-you-think-you-want-a-newco.html"
  status = 301

# The Events CMS. Only admins get these pages (gate.ts); this policy limits what they can load:
# their own scripts, Supabase Storage (thumbnails, previews, direct uploads) and the fonts.
# The preview iframe (srcdoc) inherits it.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"
