<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — NewCo Community</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap');

      :root {
        --pa-dark-blue: #00172d;
        --pa-white: #ffffff;
        --pa-red-accessible: #ea0027;
        --pa-red-accessible-hover: #c40021;
        --pa-grey-01: #e8ecf2;
        --pa-grey-02: #a2b3c9;
        --pa-grey-03: #64778a;
        --pa-aqua-04: #0580a7;
        --pa-error: #cc1d63;
        --font-primary: 'Hanken Grotesk', system-ui, sans-serif;
        --font-companion: 'Source Serif 4', Georgia, serif;
        --radius-sm: 2px;
        --radius-md: 4px;
      }

      * {
        box-sizing: border-box;
      }

      ::selection {
        background: var(--pa-dark-blue);
        color: var(--pa-white);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--pa-dark-blue);
        font-family: var(--font-companion);
        color: var(--pa-dark-blue);
        padding: 24px 16px;
      }

      .card {
        background: var(--pa-white);
        border-radius: var(--radius-md);
        max-width: 420px;
        width: 100%;
        padding: 40px 36px 36px;
      }

      .logo {
        display: block;
        height: 44px;
        width: auto;
        margin: 0 0 32px;
      }

      h1 {
        font-family: var(--font-primary);
        font-weight: 400;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
        color: var(--pa-dark-blue);
      }

      p.lead {
        font-size: 16px;
        line-height: 1.6;
        color: var(--pa-grey-03);
        margin: 0 0 32px;
      }

      label {
        display: block;
        font-family: var(--font-primary);
        font-weight: 450;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 8px;
        color: var(--pa-dark-blue);
      }

      input[type='email'] {
        display: block;
        width: 100%;
        padding: 11px 12px;
        font-family: var(--font-companion);
        font-size: 16px;
        line-height: 1.4;
        color: var(--pa-dark-blue);
        caret-color: var(--pa-red-accessible);
        background: var(--pa-white);
        border: 1px solid var(--pa-grey-03);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s ease-out;
      }

      input[type='email']:hover {
        border-color: var(--pa-dark-blue);
      }

      input[type='email']:focus-visible {
        outline: 2px solid var(--pa-aqua-04);
        outline-offset: 1px;
        border-color: var(--pa-aqua-04);
      }

      input[type='email'][aria-invalid='true'] {
        border-color: var(--pa-error);
      }

      .field-message {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--pa-error);
      }

      button {
        display: block;
        width: 100%;
        margin-top: 24px;
        padding: 14px 20px;
        font-family: var(--font-primary);
        font-weight: 450;
        font-size: 16px;
        line-height: 1;
        color: var(--pa-white);
        background: var(--pa-red-accessible);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background-color 0.15s ease-out;
      }

      button:hover:not(:disabled) {
        background: var(--pa-red-accessible-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--pa-aqua-04);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .help {
        margin: 28px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--pa-grey-01);
        font-size: 14px;
        line-height: 1.6;
        color: var(--pa-grey-03);
      }

      .help a {
        color: var(--pa-red-accessible);
        text-underline-offset: 2px;
        overflow-wrap: anywhere;
      }

      .help a:hover {
        color: var(--pa-red-accessible-hover);
      }

      .convened {
        margin: 0;
        font-family: var(--font-primary);
        font-size: 14px;
        line-height: 1.4;
        color: var(--pa-grey-02);
        text-align: center;
      }

      @media (max-width: 420px) {
        .card {
          padding: 32px 24px 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      <h1>NewCo Community</h1>
      <p class="lead">Enter your email address to access this site.</p>
      <form id="login-form" novalidate>
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          spellcheck="false"
          aria-describedby="login-error"
        />
        <p id="login-error" class="field-message" role="alert" hidden></p>
        <button type="submit" id="submit-btn">Continue</button>
      </form>
      <p class="help">
        Membership is by invitation. To request access, email
        <a href="mailto:newco.community@paconsulting.com"
          >newco.community@paconsulting.com</a
        >.
      </p>
    </main>
    <p class="convened">Convened by PA Consulting's NewCos Team</p>
    <script>
      ;(function () {
        var form = document.getElementById('login-form')
        var emailInput = document.getElementById('email')
        var errorBox = document.getElementById('login-error')
        var submitBtn = document.getElementById('submit-btn')

        var MESSAGES = {
          empty: 'Enter your email address.',
          invalid: 'Enter a valid email address, like name@department.gov.uk.',
          denied:
            'That email isn’t on our access list. Check it for typos, or request access using the address below.',
          network:
            'We couldn’t check your email just now. Check your connection and try again.',
        }

        function showError(key) {
          errorBox.textContent = MESSAGES[key]
          errorBox.hidden = false
          emailInput.setAttribute('aria-invalid', 'true')
        }

        function clearError() {
          errorBox.hidden = true
          errorBox.textContent = ''
          emailInput.removeAttribute('aria-invalid')
        }

        // Only ever redirect within this site. Resolving the URL (rather than
        // checking its first characters) also catches tricks like "/\t/evil.com",
        // which browsers normalise to "//evil.com".
        function safeReturnTo() {
          var r = new URLSearchParams(location.search).get('returnTo') || '/'
          try {
            var u = new URL(r, location.origin)
            if (u.origin === location.origin) return u.pathname + u.search + u.hash
          } catch (err) {}
          return '/'
        }

        function resetButton() {
          submitBtn.disabled = false
          submitBtn.textContent = 'Continue'
        }

        emailInput.addEventListener('input', function () {
          if (!errorBox.hidden) clearError()
        })

        form.addEventListener('submit', function (e) {
          e.preventDefault()
          clearError()

          var email = emailInput.value.trim()
          if (!email) {
            showError('empty')
            emailInput.focus()
            return
          }
          if (!emailInput.checkValidity()) {
            showError('invalid')
            emailInput.focus()
            return
          }

          submitBtn.disabled = true
          submitBtn.textContent = 'Checking…'

          fetch('/.netlify/functions/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
          })
            .then(function (res) {
              return res.json()
            })
            .then(function (data) {
              if (data.ok) {
                location.href = safeReturnTo()
              } else {
                showError('denied')
                resetButton()
                emailInput.focus()
              }
            })
            .catch(function () {
              showError('network')
              resetButton()
            })
        })
      })()
    </script>
